name: Cao targeted replication backfills
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - run: python scripts/cao_targeted_backfills.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-targeted-backfills
          path: cao_targeted/
          retention-days: 7
