name: Cao full replication data probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas sdmx1
      - run: python scripts/cao_full_data_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-full-data-probe
          path: cao_full_probe/
          retention-days: 7
