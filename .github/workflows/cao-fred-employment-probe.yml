name: Cao OECD FRED employment probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/cao_fred_employment_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-fred-employment
          path: cao_fred_emp/
          retention-days: 7
