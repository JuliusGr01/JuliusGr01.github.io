name: Cao final source gaps
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas beautifulsoup4 sdmx1 lxml
      - run: python scripts/cao_final_source_gaps.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-final-source-gaps
          path: cao_final_gaps/
          retention-days: 7
