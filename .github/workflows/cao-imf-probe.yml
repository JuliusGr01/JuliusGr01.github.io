name: Cao IMF probe
on:
  push:
    branches: [cao-data-fetch-temp]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/cao_imf_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-imf-probe
          path: cao_probe/
