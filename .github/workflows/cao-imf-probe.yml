name: Cao IMF data fetch
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/cao_imf_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-imf-macro-panel-fast
          path: cao_output_fast/
