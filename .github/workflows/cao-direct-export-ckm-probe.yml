name: Cao direct export and CKM probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas beautifulsoup4
      - run: python scripts/cao_direct_export_ckm_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cao-direct-export-ckm-probe
          path: cao_direct_probe/
          retention-days: 7
